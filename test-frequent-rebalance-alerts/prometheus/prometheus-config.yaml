---
# Service to expose the Strimzi Cluster Operator metrics port (8080)
# so Prometheus can scrape it.
apiVersion: v1
kind: Service
metadata:
  name: strimzi-cluster-operator-metrics
  labels:
    app: strimzi
spec:
  selector:
    name: strimzi-cluster-operator
  ports:
    - name: metrics
      port: 8080
      targetPort: 8080

---
# Prometheus ConfigMap — main config + alerting rules in a single file.
# Two alerts:
#   FrequentAutoRebalanceOnImbalance  — fixable anomalies > 3 in 10 min
#   UnfixableGoalViolationsDetected   — any unfixable/mixed anomaly
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  labels:
    app: prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    rule_files:
      - /etc/prometheus/alerting-rules.yaml

    scrape_configs:
      - job_name: 'strimzi-cluster-operator'
        static_configs:
          - targets: ['strimzi-cluster-operator-metrics:8080']
        metrics_path: /metrics

  alerting-rules.yaml: |
    groups:
      - name: strimzi.auto-rebalance-on-imbalance
        interval: 30s
        rules:

          - alert: FrequentAutoRebalanceOnImbalance
            expr: |
              increase(
                strimzi_auto_rebalance_anomalies_detected_total{
                  type="goal_violation",
                  fixability="fixable"
                }[10m]
              ) > 3
            for: 0m
            labels:
              severity: warning
            annotations:
              summary: "Frequent auto-rebalance on imbalance for {{ $labels.namespace }}/{{ $labels.strimzi_io_cluster }}"
              description: >
                More than 3 fixable goal violation anomalies were detected in the last 10 minutes.
                The cluster may be in a rebalancing loop. Consider reviewing anomaly detection goals
                or the detection interval. Current count: {{ $value }}

          - alert: UnfixableGoalViolationsDetected
            expr: |
              increase(
                strimzi_auto_rebalance_anomalies_detected_total{
                  type="goal_violation",
                  fixability=~"unfixable|mixed"
                }[5m]
              ) > 0
            for: 0m
            labels:
              severity: critical
            annotations:
              summary: "Unfixable goal violations blocking auto-rebalance for {{ $labels.namespace }}/{{ $labels.strimzi_io_cluster }}"
              description: >
                Unfixable or mixed goal violations detected. Auto-rebalance on imbalance is blocked.
                Manual intervention is required (add racks/brokers/resources).
                Fixability: {{ $labels.fixability }}

---
# Prometheus Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  labels:
    app: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:latest
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.retention.time=1h"
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
            - name: config
              mountPath: /etc/prometheus/alerting-rules.yaml
              subPath: alerting-rules.yaml
      volumes:
        - name: config
          configMap:
            name: prometheus-config

---
# Prometheus Service
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  labels:
    app: prometheus
spec:
  selector:
    app: prometheus
  ports:
    - name: web
      port: 9090
      targetPort: 9090
