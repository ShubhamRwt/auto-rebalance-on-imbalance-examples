# Test that scale-down takes priority over auto-rebalance on imbalance.
# The cluster has both add-brokers/remove-brokers and imbalance auto-rebalance configured.
# The test script:
#   1. Creates an imbalance and waits for RebalanceOnImbalance to start
#   2. Triggers a scale-down while the imbalance rebalance is in progress
#   3. Verifies the imbalance rebalance is stopped, scale-down runs first
#   4. Verifies the tracker ConfigMap is updated after scale-down completes
#   5. Verifies auto-rebalance on imbalance re-triggers if violations persist
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: controller
  labels:
    strimzi.io/cluster: test-cluster
spec:
  replicas: 3
  roles:
    - controller
  storage:
    type: ephemeral
    kraftMetadata: shared

---
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: broker
  labels:
    strimzi.io/cluster: test-cluster
spec:
  # Start with 4 brokers so we can scale down to 3
  replicas: 4
  roles:
    - broker
  storage:
    type: jbod
    volumes:
      - id: 0
        type: ephemeral
        sizeLimit: 5Gi
      - id: 1
        type: ephemeral
        sizeLimit: 5Gi

---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: test-cluster
spec:
  kafka:
    version: 4.3.0
    metadataVersion: 4.3-IV0

    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false

    config:
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      default.replication.factor: 3
      min.insync.replicas: 2

  cruiseControl:
    brokerCapacity:
      inboundNetwork: "10000KB/s"
      outboundNetwork: "10000KB/s"

    config:
      anomaly.detection.interval.ms: 120000

      anomaly.detection.goals: >
        com.linkedin.kafka.cruisecontrol.analyzer.goals.RackAwareGoal,
        com.linkedin.kafka.cruisecontrol.analyzer.goals.ReplicaCapacityGoal,
        com.linkedin.kafka.cruisecontrol.analyzer.goals.DiskCapacityGoal,
        com.linkedin.kafka.cruisecontrol.analyzer.goals.DiskUsageDistributionGoal

      goals: >
        com.linkedin.kafka.cruisecontrol.analyzer.goals.RackAwareGoal,
        com.linkedin.kafka.cruisecontrol.analyzer.goals.MinTopicLeadersPerBrokerGoal,
        com.linkedin.kafka.cruisecontrol.analyzer.goals.ReplicaCapacityGoal,
        com.linkedin.kafka.cruisecontrol.analyzer.goals.DiskCapacityGoal,
        com.linkedin.kafka.cruisecontrol.analyzer.goals.NetworkInboundCapacityGoal,
        com.linkedin.kafka.cruisecontrol.analyzer.goals.NetworkOutboundCapacityGoal,
        com.linkedin.kafka.cruisecontrol.analyzer.goals.CpuCapacityGoal,
        com.linkedin.kafka.cruisecontrol.analyzer.goals.ReplicaDistributionGoal,
        com.linkedin.kafka.cruisecontrol.analyzer.goals.PotentialNwOutGoal,
        com.linkedin.kafka.cruisecontrol.analyzer.goals.DiskUsageDistributionGoal,
        com.linkedin.kafka.cruisecontrol.analyzer.goals.NetworkInboundUsageDistributionGoal,
        com.linkedin.kafka.cruisecontrol.analyzer.goals.NetworkOutboundUsageDistributionGoal,
        com.linkedin.kafka.cruisecontrol.analyzer.goals.CpuUsageDistributionGoal,
        com.linkedin.kafka.cruisecontrol.analyzer.goals.TopicReplicaDistributionGoal,
        com.linkedin.kafka.cruisecontrol.analyzer.goals.LeaderReplicaDistributionGoal,
        com.linkedin.kafka.cruisecontrol.analyzer.goals.LeaderBytesInDistributionGoal,
        com.linkedin.kafka.cruisecontrol.analyzer.goals.PreferredLeaderElectionGoal

      default.goals: >
        com.linkedin.kafka.cruisecontrol.analyzer.goals.RackAwareGoal,
        com.linkedin.kafka.cruisecontrol.analyzer.goals.ReplicaCapacityGoal,
        com.linkedin.kafka.cruisecontrol.analyzer.goals.DiskCapacityGoal,
        com.linkedin.kafka.cruisecontrol.analyzer.goals.DiskUsageDistributionGoal

      hard.goals: >
        com.linkedin.kafka.cruisecontrol.analyzer.goals.RackAwareGoal

    autoRebalance:
      - mode: add-brokers
        template:
          name: test-scaling-template
      - mode: remove-brokers
        template:
          name: test-scaling-template
      - mode: imbalance
        template:
          name: test-imbalance-template

---
apiVersion: kafka.strimzi.io/v1
kind: KafkaRebalance
metadata:
  name: test-scaling-template
  annotations:
    strimzi.io/rebalance-template: "true"
spec:
  goals:
    - RackAwareGoal
    - ReplicaCapacityGoal
    - DiskCapacityGoal
    - DiskUsageDistributionGoal

---
apiVersion: kafka.strimzi.io/v1
kind: KafkaRebalance
metadata:
  name: test-imbalance-template
  annotations:
    strimzi.io/rebalance-template: "true"
spec:
  goals:
    - RackAwareGoal
    - ReplicaCapacityGoal
    - DiskCapacityGoal
    - DiskUsageDistributionGoal
